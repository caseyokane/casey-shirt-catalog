<h1>This is the website</h1>

<p>Look at me</p>

<!--Want to use Javascript to dynamically show all images in the /assets folder in a grid-->
<div id="image-grid"></div>
<script>
  // Function to fetch and display images from the /assets folder
  async function loadImages() {
    try {
      const response = await fetch('/assets');
      if (!response.ok) {
        throw new Error('Network response was not ok');
      }
      const images = await response.json();
      const imageGrid = document.getElementById('image-grid');

      images.forEach(image => {
        const imgElement = document.createElement('img');
        imgElement.src = `/assets/${image}`;
        imgElement.alt = image;
        imgElement.style.width = '200px'; // Set a fixed width for the images
        imgElement.style.margin = '10px'; // Add some spacing between images
        imageGrid.appendChild(imgElement);
      });
    } catch (error) {
      console.error('Error fetching images:', error);
    }
  }

  // Call the function to load images when the page loads
  window.onload = loadImages;
</script>
